services:
  - type: web
    name: ambiente-efimero-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: REGION
        value: oregon
      - key: MENSAJE
        value: Ambiente efimero de demostracion
